<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYT Website</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --fg: #f2f2f2;
      --accent: #6c8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    main { max-width: 32rem; }
    h1 {
      font-size: 2.25rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #a3a7b3;
      line-height: 1.5;
    }
    code {
      background: #1c1f27;
      padding: 0.15rem 0.4rem;
      border-radius: 0.3rem;
      color: var(--accent);
    }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--accent);
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>It works 🎉</h1>
    <p>
      This page is served directly from the <code>byt_websites</code> GitHub repo
      via GitHub Pages — no server, no DNS, no Cloudflare setup required.
    </p>
    <p>Edit <code>index.html</code> and push to <code>main</code> to update this page.</p>
    <span class="badge">GitHub Pages test</span>
  </main>
</body>
</html>
